<div class="search-container">
  <div class="control has-icons-left search">
    <input class="input" type="search" placeholder="Search" aria-label="Search songs" [(ngModel)]="filter">
    <span class="icon is-small is-left">
      <fa-icon [icon]="icons.search" />
    </span>
  </div>
</div>

<div class="container">
  @if (items()) {
    <div class="song-list">
      <cdk-virtual-scroll-viewport itemSize="46.38" class="song-scroll">
        <div *cdkVirtualFor="let item of visibleItems(); trackBy: trackItem">
          <div class="card song-element" [class.club-element]="item.kind === 'club'">
            <div class="card-content">
              @if (loggedIn() && item.kind === 'song') {
                <button type="button" class="song-favorite plain-button" aria-label="Toggle favorite"
                        (click)="toggleFavorite(item)">
                  <fa-icon [icon]="isFavorite(item) ? icons.starSolid : icons.star" />
                </button>
              }
              <a class="song-info" [routerLink]="[item.kind === 'club' ? '/club' : '/song', item.id]">
                <span class="song-name">{{ item.name }}</span>
                <span class="song-page">p. {{ item.page }}</span>
              </a>
            </div>
          </div>
        </div>
      </cdk-virtual-scroll-viewport>
    </div>
  } @else {
    <progress class="progress is-small is-primary" max="100"></progress>
  }
</div>

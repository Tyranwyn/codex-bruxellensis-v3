<div class="modal" [class.is-active]="open()">
  <div class="modal-background" (click)="close()" aria-hidden="true"></div>
  <form class="modal-card" [formGroup]="form" (ngSubmit)="save()">
    <header class="modal-card-head">
      <p class="modal-card-title">{{ song() ? (song()!.title || song()!.associationName) : 'Add Song' }}</p>
      <button type="button" class="delete" aria-label="close" (click)="close()"></button>
    </header>

    <section class="modal-card-body">
      <div class="field">
        <label class="label" for="song-category">Category</label>
        <div class="control">
          <div class="select" [class.is-danger]="form.controls.category.touched && form.controls.category.invalid">
            <select id="song-category" formControlName="category">
              <option value="">Select Category</option>
              @for (category of categories; track category) {
                <option [value]="category">{{ category | capitalize }}</option>
              }
            </select>
          </div>
        </div>
      </div>

      <div class="field">
        <label class="label" for="song-page">Page</label>
        <div class="control">
          <input id="song-page" class="input" type="number" placeholder="Page" formControlName="page">
        </div>
      </div>

      <div class="field">
        <label class="label" for="song-title">Title</label>
        <div class="control">
          <input id="song-title" class="input" type="text" placeholder="Title" formControlName="title">
        </div>
      </div>

      <div class="field">
        <label class="label" for="song-bg-info">Background Information</label>
        <div class="control">
          <textarea id="song-bg-info" class="textarea" placeholder="Background Information..." formControlName="bgInfo"></textarea>
        </div>
      </div>

      <div class="field">
        <label class="label" for="song-lyrics">Lyrics</label>
        <div class="control">
          <textarea id="song-lyrics" class="textarea" placeholder="Lyrics..." formControlName="lyrics"></textarea>
        </div>
      </div>

      <div class="field">
        <label class="label" for="song-association-name">Association Name</label>
        <div class="control">
          <input id="song-association-name" class="input" type="text" placeholder="Association Name" formControlName="associationName">
        </div>
      </div>

      <div class="field">
        <label class="label" for="song-association-info">Association Information</label>
        <div class="control">
          <textarea id="song-association-info" class="textarea" placeholder="Association Information..." formControlName="associationInfo"></textarea>
        </div>
      </div>

      <div class="field">
        <label class="label" for="song-battle-cry-name">Battle Cry Name</label>
        <div class="control">
          <input id="song-battle-cry-name" class="input" type="text" placeholder="Battle Cry Name" formControlName="battleCryName">
        </div>
      </div>

      <div class="field">
        <label class="label" for="song-battle-cry-info">Battle Cry Information</label>
        <div class="control">
          <textarea id="song-battle-cry-info" class="textarea" placeholder="Battle Cry Information..." formControlName="battleCryInfo"></textarea>
        </div>
      </div>

      <div class="field">
        <label class="label" for="song-battle-cry">Battle Cry Lyrics</label>
        <div class="control">
          <textarea id="song-battle-cry" class="textarea" placeholder="Lyrics..." formControlName="battleCry"></textarea>
        </div>
      </div>

      @if (song()) {
        <button type="button" class="song-delete plain-button" [disabled]="saving()" (click)="delete()">Delete...</button>
      }
    </section>

    <footer class="modal-card-foot buttons">
      <button type="submit" class="button is-success" [class.is-loading]="saving()">{{ song() ? 'Save' : 'Add' }}</button>
      <button type="button" class="button" (click)="close()">Cancel</button>
    </footer>
  </form>
</div>

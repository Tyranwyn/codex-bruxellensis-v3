<p class="pages">p. 174</p>
<dl class="meta"><dt>M</dt><dd>‘Marche Américaine’</dd></dl>

<div class="stanza verse"><div class="lines"><span class="line" style="grid-row:1">Wij gaan naar het land van Hawaï,</span><span class="line" style="grid-row:2">Naar het land van de wuivende wijven,</span><span class="line" style="grid-row:3">Daar lopen ze bloot in de wei,</span><span class="line" style="grid-row:4">Tot dat g’er niet meer af kunt blijven!</span></div></div>

<p class="pages">p. 386</p>

<div class="stanza verse"><div class="lines"><span class="line" style="grid-row:1">Quand on a une gueul’ comme ça,</span><span class="line" style="grid-row:2">On la ferme, on la ferme!</span><span class="line" style="grid-row:3">Quand on a une gueul’ comme ça,</span><span class="line" style="grid-row:4">On la ferme et on s’en va!</span></div></div>
